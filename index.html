<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Interpolación de Rendimiento en Runners</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="https://cdn-icons-png.flaticon.com/512/201/201818.png" alt="Runner Logo">
        </div>

        <h1>Estimación de Tiempo para Runners</h1>

        <label for="nombre">Nombre del corredor:</label>
        <input type="text" id="nombre" placeholder="Ingresa tu nombre">

        <label for="distancia">Distancia a estimar (km):</label>
        <input type="number" id="distancia" value="1.7" step="0.1">

        <div class="buttons">
            <button onclick="estimar()">Estimar</button>
            <button onclick="mostrarDatos()">Mostrar Datos</button>
            <button onclick="mostrarHistorial()">Ver Historial</button>
            <button onclick="eliminarUltimo()">Eliminar Último Dato</button>
            <button onclick="resetear()">Reiniciar Gráfica</button>
        </div>

        <div id="resultado"></div>
        <canvas id="grafica" width="600" height="400"></canvas>
    </div>

    <script src="js/lagrange.js"></script>
</body>
</html>
