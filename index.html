<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Interpolación de Rendimiento en Runners</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 90%;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            text-align: center;
        }

        .logo img {
            width: 80px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 8px #fff);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #ffffff;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        button {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #00c9a7;
            color: #fff;
            transition: background 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #00b29b;
            transform: scale(1.05);
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 18px;
        }

        canvas {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="https://cdn-icons-png.flaticon.com/512/201/201818.png" alt="Runner Logo">
        </div>

        <h1>Estimación de Tiempo para Runners</h1>

        <label for="nombre">Nombre del corredor:</label>
        <input type="text" id="nombre" placeholder="Ingresa tu nombre">

        <label for="distancia">Distancia a estimar (km):</label>
        <input type="number" id="distancia" value="1.7" step="0.1">

        <div class="buttons">
            <button onclick="estimar()">Estimar</button>
            <button onclick="mostrarDatos()">Mostrar Datos</button>
            <button onclick="mostrarHistorial()">Ver Historial</button>
            <button onclick="eliminarUltimo()">Eliminar Último Dato</button>
            <button onclick="resetear()">Reiniciar Gráfica</button>
        </div>

        <div id="resultado"></div>
        <canvas id="grafica" width="600" height="400"></canvas>
    </div>

    <script src="js/lagrange.js"></script>
</body>
</html>
